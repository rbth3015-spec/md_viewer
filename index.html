<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MD Viewer</title>
    <script>
      // 깜빡임 방지: 저장된 테마를 렌더링 전에 먼저 적용
      try {
        const t = localStorage.getItem("theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch {}
    </script>
  </head>
  <body>
    <div class="app" id="app">
      <header class="topbar">
        <div class="topbar-side">
          <button class="icon-btn" id="btn-toc" title="목차 (Ctrl+\)" aria-label="목차">
            <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h10M4 18h13" /></svg>
          </button>
        </div>
        <div class="doc-name" id="doc-name"></div>
        <div class="topbar-side right">
          <button class="icon-btn" id="btn-copy" title="문서 원문 복사" aria-label="문서 원문 복사">
            <svg viewBox="0 0 24 24"><rect x="8.5" y="8.5" width="11" height="11" rx="2" /><path d="M15.5 8.5v-2a2 2 0 0 0-2-2h-7a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h2" /></svg>
          </button>
          <button class="icon-btn" id="btn-edit" title="편집 (Ctrl+E)" aria-label="편집">
            <svg viewBox="0 0 24 24"><path d="M4.5 19.5h4l10-10a2.83 2.83 0 0 0-4-4l-10 10z" /><path d="M13.5 6.5l4 4" /></svg>
          </button>
          <button class="icon-btn" id="btn-open" title="열기 (Ctrl+O)" aria-label="열기">
            <svg viewBox="0 0 24 24"><path d="M3.5 7.5a2 2 0 0 1 2-2h4l2 2h7a2 2 0 0 1 2 2v7.5a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z" /></svg>
          </button>
          <button class="icon-btn" id="btn-theme" title="테마 전환 (Ctrl+D)" aria-label="테마 전환">
            <svg viewBox="0 0 24 24" class="i-auto"><circle cx="12" cy="12" r="7.5" /><path d="M12 4.5v15a7.5 7.5 0 0 0 0-15z" class="fill" /></svg>
            <svg viewBox="0 0 24 24" class="i-light"><circle cx="12" cy="12" r="4" /><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4" /></svg>
            <svg viewBox="0 0 24 24" class="i-dark"><path d="M19.5 14.5A8 8 0 0 1 9.5 4.5a8 8 0 1 0 10 10z" /></svg>
          </button>
        </div>
        <div class="progress" id="progress"></div>
      </header>

      <nav class="tabbar" id="tabbar"></nav>

      <aside class="toc" id="toc">
        <div class="side-tabs">
          <button class="side-tab" data-mode="toc">목차</button>
          <button class="side-tab" data-mode="files">파일</button>
        </div>
        <nav id="toc-nav" class="side-list"></nav>
        <nav id="files-nav" class="side-list"></nav>
      </aside>

      <section class="editor" id="editor"></section>

      <main class="reader" id="reader">
        <article class="doc" id="doc"></article>
      </main>

      <div class="findbar" id="findbar">
        <input id="find-input" type="text" placeholder="문서에서 찾기" spellcheck="false" />
        <span class="find-count" id="find-count"></span>
        <button class="icon-btn small" id="find-prev" title="이전 (Shift+Enter)" aria-label="이전">
          <svg viewBox="0 0 24 24"><path d="M7 14l5-5 5 5" /></svg>
        </button>
        <button class="icon-btn small" id="find-next" title="다음 (Enter)" aria-label="다음">
          <svg viewBox="0 0 24 24"><path d="M7 10l5 5 5-5" /></svg>
        </button>
        <button class="icon-btn small" id="find-close" title="닫기 (Esc)" aria-label="닫기">
          <svg viewBox="0 0 24 24"><path d="M7 7l10 10M17 7L7 17" /></svg>
        </button>
      </div>

      <div class="lightbox" id="lightbox"><img alt="" /></div>

      <div class="drop-overlay" id="drop-overlay">
        <div class="drop-frame">놓으면 열립니다</div>
      </div>
      <div class="toast" id="toast"></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
