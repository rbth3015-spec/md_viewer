name: Windows 빌드

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

# 릴리스에 설치 파일을 올리려면 쓰기 권한이 필요하다
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - run: npm run tauri build

      # 버전과 상관없이 늘 같은 이름으로 (최신 버전 고정 링크용)
      - name: 설치 파일 이름 정리
        shell: pwsh
        run: |
          $exe = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          Copy-Item $exe.FullName MD-Viewer-Setup.exe

      # 작업 브랜치·PR 빌드는 지금처럼 Actions 에서 확인용으로 받는다
      - uses: actions/upload-artifact@v4
        with:
          name: MD-Viewer-Windows
          path: MD-Viewer-Setup.exe
          if-no-files-found: error

      # main 에 합쳐지면 릴리스 페이지에 .exe 를 바로 올린다 (같은 버전이면 덮어씀)
      - name: 릴리스에 올리기
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" MD-Viewer-Setup.exe --clobber
          else
            gh release create "$TAG" MD-Viewer-Setup.exe \
              --target "$GITHUB_SHA" \
              --title "MD Viewer $VERSION" \
              --notes "아래 MD-Viewer-Setup.exe 를 받아 실행하면 설치(또는 덮어 설치)됩니다."
          fi
